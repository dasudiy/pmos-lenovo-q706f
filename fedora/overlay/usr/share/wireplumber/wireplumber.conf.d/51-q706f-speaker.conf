# The sm8250 TDM backend is fixed to S16_LE; feed it S16 like pmOS PulseAudio
# did instead of letting the ADSP convert from S24_LE (quiet speakers).
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.platform-sound.*" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
      }
    }
  }
]
