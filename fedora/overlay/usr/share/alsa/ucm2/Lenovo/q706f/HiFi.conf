		#cset "name='SPK3 DACPCM Source' DSP_TX1"
		#cset "name='SPK4 DACPCM Source' DSP_TX1"
		cset "name='SPK1 AMP Enable Switch' 1"
		cset "name='SPK2 AMP Enable Switch' 1"
		cset "name='SPK3 AMP Enable Switch' 1"
		cset "name='SPK4 AMP Enable Switch' 1"

	]

	DisableSequence [
		cset "name='SPK1 AMP Enable Switch' 0"
		cset "name='SPK2 AMP Enable Switch' 0"
		cset "name='SPK3 AMP Enable Switch' 0"
		cset "name='SPK4 AMP Enable Switch' 0"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "Digital PCM"
		#PlaybackMasterElem "Analog PCM"
		PlaybackVolume "Digital PCM Volume"
	}
}

# Internal microphones (needs DT patch 0020): two analog mics on WCD938x,
# AMIC1 -> ADC1 -> TX SMIC0 -> DEC0 and AMIC3 -> ADC2(INP3) -> TX SMIC1 -> DEC1,
# captured through TX_CODEC_DMA_TX_3 into MultiMedia1 (vendor "dual-amic").
# Absent codec controls must not define this device: PipeWire then drops the
# whole HiFi verb and the speakers disappear.
If.mic {
	Condition {
		Type ControlExists
		Control "name='ADC1_MIXER Switch'"
	}
	True.SectionDevice."Mic" {
	Comment "Internal microphones"

	EnableSequence [
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='TX0 MODE' ADC_NORMAL"
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='HDR12 MUX' NO_HDR12"
		cset "name='ADC2 MUX' INP3"
		cset "name='ADC2 Switch' 1"
		cset "name='TX1 MODE' ADC_NORMAL"

		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC0"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX1' ADC1"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='TX_DEC0 Volume' 100"
		cset "name='TX_DEC1 Volume' 100"

		cset "name='MultiMedia1 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='MultiMedia1 Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX SMIC MUX1' ZERO"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='TX0 MODE' ADC_INVALID"
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='ADC2 Switch' 0"
		cset "name='TX1 MODE' ADC_INVALID"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},0"
		CaptureChannels 2
	}
	}
}
