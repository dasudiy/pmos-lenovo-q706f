# Virtual cameras for apps that only speak V4L2 (WebRTC / Flatpak WeChat).
# exclusive_caps=1: node advertises CAPTURE only while a producer streams,
# so Chromium/WebRTC sees a plain capture device (needs always-on producer).
options v4l2loopback devices=2 video_nr=40,41 card_label="Back Camera","Front Camera" exclusive_caps=1
